name: Publish to NuGet

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write # needed for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Pack
        run: dotnet pack -c Release -o out

      # exchanges the GitHub OIDC token for a short-lived nuget.org API key,
      # no long-lived secrets stored anywhere
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          # your nuget.org profile name, NOT your email; set it as a repo secret
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push out/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
